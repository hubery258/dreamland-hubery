site_name: Hubery's notebook
site_url: https://note.ramenboy.cc/

theme:
  name: material
  palette: 
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: 关闭自动模式
    
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: deep orange 
      accent: blue 
      toggle:
        icon: material/brightness-7
        name: 切换至夜间模式 

    - media: "(prefers-color-scheme: dark)"
      scheme: slate 
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至日间模式
    
  features:
    - announce.dismiss #呈现可标记为由用户读取的临时公告，可以包含一个用于取消当前公告的按钮
    # - navigation.instant
    #- header.autohide  #自动隐藏
    - navigation.tracking #地址栏中的 URL 将自动更新为在目录中突出显示的活动锚点
    - navigation.tabs #顶级部分将呈现在上面视口标题下方的菜单层中，但在移动设备上保持原样
    # - navigation.tabs.sticky  #启用粘性选项卡后，导航选项卡将锁定在标题下方，并在向下滚动时始终保持可见
    # - navigation.sections 
    # - navigation.expand
    - navigation.top # 返回顶部的按钮 在上滑时出现
    - navigation.footer #页脚将呈现在边栏中，但在移动设备上保持原样
    - search.suggest # 搜索输入一些字母时推荐补全整个单词
    - search.highlight # 搜索出的文章关键词加入高亮
    - search.share #搜索分享按钮
    - navigation.indexes #启用节索引页后，可以将文档直接附加到节
    - content.tabs.link
    - content.tooltips
    - content.code.copy #代码复制
    - content.code.annotate

  language: zh # 一些提示性的文字会变成中文
  icon:
    repo: fontawesome/brands/git-alt #右上角图标
    logo: logo
    admonition:
      note: fontawesome/solid/note-sticky
      tip: fontawesome/solid/bullhorn
      warning: fontawesome/solid/triangle-exclamation
      example: fontawesome/solid/flask
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info


extra:
  social:
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/2134294131
      name: bilibili
    - icon: fontawesome/brands/github
      link: https://github.com/hubery258
      name: github

extra_css:
  - css/friends.css


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
      block_syntax:
        - dollar
        - square
        - begin
  - pymdownx.tasklist:
      custom_checkbox: true # 启用待办拓展

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

repo_url: https://github.com/hubery258/notebook
repo_name: note

